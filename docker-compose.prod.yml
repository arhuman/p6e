# Production overlay: joins the host's existing reverse proxy rather than
# publishing 8080 itself, keeps the admin surface off the public interface, and
# bounds what one runaway pipeline can take from the host.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Requires an external `proxy` network already created by the host's shared
# Traefik. Never ship a per-app proxy binding 80/443.

services:
  p6e:
    container_name: p6e
    restart: always
    networks:
      - proxy
    ports:
      # Only the admin port is published, and only to loopback, so a scraper or
      # an SSH tunnel can reach it while the internet cannot. Webhooks arrive
      # through the proxy instead.
      - "127.0.0.1:${P6E_ADMIN_PORT:-8081}:8081"
    # List syntax rather than a mapping, matching the canonical 10x compose
    # template. Both are valid docker-compose; staying with the canonical one
    # keeps these labels greppable by the tooling that audits them.
    labels:
      - traefik.enable=true
      # The service is on more than one network, so the proxy must be told which
      # one to route over, or the choice is non-deterministic.
      - traefik.docker.network=proxy
      - traefik.http.services.p6e.loadbalancer.server.port=8080

      # Security headers, applied at the edge to both routers.
      #
      # This endpoint is machine-to-machine, so these do less than they would in
      # front of a browser: HSTS is here to stop a caller being downgraded to
      # plaintext and having its payload (and any token in it) read, not to
      # protect a session cookie. The rest cost nothing and close the gap
      # anyway, because "nobody points a browser at it" is an assumption about
      # today rather than a property of the service.
      - traefik.http.middlewares.p6e-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.p6e-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.p6e-headers.headers.stsPreload=true
      - traefik.http.middlewares.p6e-headers.headers.forceSTSHeader=true
      - traefik.http.middlewares.p6e-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.p6e-headers.headers.frameDeny=true
      - traefik.http.middlewares.p6e-headers.headers.browserXssFilter=true
      - traefik.http.middlewares.p6e-headers.headers.referrerPolicy=no-referrer

      # Edge authentication. A webhook pipeline with no `auth` block in its
      # trigger runs for anyone who can reach this router, and the exec node
      # runs local processes, so an open route in front of a pipeline that
      # shells out is remote process execution.
      #
      # This is deliberately belt and braces with the trigger's own signature
      # check (ADR 0013): the two answer different questions. A proxy cannot
      # verify a sender's HMAC scheme on the daemon's behalf, and a signature
      # does not authenticate anyone who has no scheme to sign with.
      #
      # Generate the hash with: htpasswd -nbB <user> <password>
      # Then put the result in .env as P6E_BASIC_AUTH, doubling every $ sign.
      # Comment the middleware out only if every served pipeline configures
      # trigger auth, and say so in your deployment notes.
      - "traefik.http.middlewares.p6e-auth.basicauth.users=${P6E_BASIC_AUTH:?set P6E_BASIC_AUTH in .env, or read the comment above before removing this}"

      # Canonical www plus a bare apex router, two routers onto one service.
      - "traefik.http.routers.p6e.rule=Host(`www.${APEX_DOMAIN:?set APEX_DOMAIN in .env}`)"
      - traefik.http.routers.p6e.entrypoints=websecure
      - traefik.http.routers.p6e.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.p6e.priority=1
      - traefik.http.routers.p6e.middlewares=p6e-auth@docker,p6e-headers@docker
      - "traefik.http.routers.p6e-bare.rule=Host(`${APEX_DOMAIN}`)"
      - traefik.http.routers.p6e-bare.entrypoints=websecure
      - traefik.http.routers.p6e-bare.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.p6e-bare.middlewares=p6e-auth@docker,p6e-headers@docker
    # A pipeline can shell out and make HTTP calls, so it is worth bounding what
    # one bad pipeline can take from the host. The step budget bounds goroutines
    # inside the process; this bounds the process itself.
    deploy:
      resources:
        limits:
          cpus: "${P6E_CPU_LIMIT:-2.0}"
          memory: ${P6E_MEMORY_LIMIT:-512M}
    ulimits:
      nofile:
        soft: 8192
        hard: 8192

networks:
  proxy:
    external: true
